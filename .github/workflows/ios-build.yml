name: iOS build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# A newer push cancels the older run, so the ci-screenshots branch always matches the latest commit.
concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, screenshots & IPA
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild -project Quesly.xcodeproj -scheme Quesly \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build-sim.log | grep -E "error:|\*\* BUILD" || true
          grep -q "BUILD SUCCEEDED" build-sim.log

      - name: Take screenshots in the simulator
        run: |
          set -x
          DEVICE=$(xcrun simctl list devices available | grep -E "iPhone 16 \(" | head -1 | grep -oE "[0-9A-F-]{36}")
          [ -z "$DEVICE" ] && DEVICE=$(xcrun simctl list devices available | grep -E "iPhone" | head -1 | grep -oE "[0-9A-F-]{36}")
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true
          xcrun simctl install "$DEVICE" build/sim/Build/Products/Debug-iphonesimulator/Quesly.app
          mkdir -p screenshots
          i=1
          shoot() { # $1 = screen, $2 = file name
            xcrun simctl terminate "$DEVICE" app.quesly.ios || true
            SIMCTL_CHILD_QUESLY_SCREEN=$1 xcrun simctl launch "$DEVICE" app.quesly.ios
            sleep 7
            xcrun simctl io "$DEVICE" screenshot "screenshots/$2.png"
          }
          i=1
          for screen in welcome findFriends notifyPrime question composer feed feedEnd tray feedError offline friends otherProfile share reactions discover notifications profile saved settings editProfile achievements; do
            shoot $screen "$(printf '%02d' $i)-$screen"; i=$((i+1))
          done
          # Dark appearance pass
          xcrun simctl ui "$DEVICE" appearance dark || true
          for screen in question feed reactions discover notifications profile settings; do
            shoot $screen "dark-$screen"
          done
          xcrun simctl ui "$DEVICE" appearance light || true
          # Largest accessibility text size pass (Dynamic Type)
          xcrun simctl ui "$DEVICE" content_size accessibility-extra-large || true
          for screen in feed profile settings; do
            shoot $screen "xl-$screen"
          done
          xcrun simctl ui "$DEVICE" content_size large || true

      - uses: actions/upload-artifact@v4
        with:
          name: Quesly-screenshots
          path: screenshots

      - name: Publish screenshots to the ci-screenshots branch
        if: github.event_name != 'pull_request'
        run: |
          cd screenshots
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          { echo "# Quesly screenshots"; echo; echo "Commit: ${GITHUB_SHA}"; echo;
            for f in *.png; do echo "### ${f%.png}"; echo "<img src=\"$f\" width=\"300\">"; echo; done; } > README.md
          git add -A
          git commit -qm "Screenshots for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots

      - name: Build unsigned IPA (for Sideloadly / AltStore)
        run: |
          set -o pipefail
          xcodebuild -project Quesly.xcodeproj -scheme Quesly \
            -destination 'generic/platform=iOS' \
            -configuration Release -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee build-device.log | grep -E "error:|\*\* BUILD" || true
          grep -q "BUILD SUCCEEDED" build-device.log
          mkdir -p Payload
          cp -R build/device/Build/Products/Release-iphoneos/Quesly.app Payload/
          zip -qr Quesly.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Quesly-ipa
          path: Quesly.ipa
